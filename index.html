<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shields.io Badge Previewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Badge<span>Previewer</span></h1>
            <p>Design your shields.io badges in real-time.</p>
        </header>

        <main class="dashboard">
            <section class="glass-panel form-section">
                <h2>Badge Settings</h2>
                <form id="badgeForm">
                    <div class="form-group">
                        <label for="label">Label</label>
                        <input type="text" id="label" placeholder="e.g. build">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <input type="text" id="message" placeholder="e.g. passing">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="color">Color</label>
                            <div class="color-input-wrapper">
                                <input type="text" id="color" placeholder="e.g. brightgreen, #ff69b4">
                                <input type="color" id="colorPicker" value="#007ec6" title="Pick a color">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="labelColor">Label Color</label>
                            <div class="color-input-wrapper">
                                <input type="text" id="labelColor" placeholder="e.g. 333, red">
                                <input type="color" id="labelColorPicker" value="#555555" title="Pick a color">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="style">Style</label>
                        <select id="style">
                            <option value="flat">Flat</option>
                            <option value="flat-square">Flat Square</option>
                            <option value="plastic">Plastic</option>
                            <option value="for-the-badge">For The Badge</option>
                            <option value="social">Social</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="logo">Logo (Simple Icons)</label>
                            <input type="text" id="logo" placeholder="e.g. github, react">
                        </div>
                        <div class="form-group">
                            <label for="logoColor">Logo Color</label>
                            <div class="color-input-wrapper">
                                <input type="text" id="logoColor" placeholder="e.g. white, #000">
                                <input type="color" id="logoColorPicker" value="#ffffff" title="Pick a color">
                            </div>
                        </div>
                    </div>
                </form>
            </section>

            <section class="glass-panel preview-section">
                <h2>Live Preview</h2>
                <div class="preview-container">
                    <img id="badgePreview" src="https://img.shields.io/badge/badge-preview-blue?style=flat" alt="Badge Preview">
                </div>
                
                <div class="snippet-section">
                    <label for="markdownSnippet">Markdown</label>
                    <div class="snippet-wrapper">
                        <input type="text" id="markdownSnippet" readonly>
                        <button id="copyBtn" aria-label="Copy to clipboard" title="Copy to clipboard">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                    <span id="copyFeedback" class="feedback">Copied!</span>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
